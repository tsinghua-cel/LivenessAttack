    environment:
      - PEER_SERVICES=beacon1,beacon2,beacon3,beacon5
      - EXECUTE=execute4
      - MAXPEERS=70
      - ATTACKER_SERVICE_URL=http://attacker2:10000
      - P2PKEY=c118a256c6aa383b0d02a6ac25139566bc042c837f248e71aa38fcd961dac8aa
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 4
    ports:
      - target: 13000
        published: 13000
        protocol: tcp
        mode: host
    volumes:
      - /opt/liveness/beacon.sh:/usr/local/bin/beacon.sh
      - /opt/liveness/config:/root/config
      - beacon4_data:/root/beacondata
    depends_on:
      - execute4
    networks:
      - meta

  beacon5:
    image: tscel/bf.prysm:v5.2.0-liveness
    entrypoint: /usr/local/bin/beacon.sh
    environment:
      - PEER_SERVICES=beacon1,beacon2,beacon3,beacon4
      - EXECUTE=execute5
      - MAXPEERS=70
      - ATTACKER_SERVICE_URL=http://attacker2:10000
      - P2PKEY=f01cd004ad47970f7ca62dadb1921a173c9686cf11e963c04d8a81f36322fd9f
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 5
    ports:
      - target: 13000
        published: 13000
        protocol: tcp
        mode: host
    volumes:
      - /opt/liveness/beacon.sh:/usr/local/bin/beacon.sh
      - /opt/liveness/config:/root/config
      - beacon5_data:/root/beacondata
    depends_on:
      - execute5
    networks:
