      placement:
        constraints:
          - node.labels.service-set == 1
    volumes:
      - ${BASEDIR}./entrypoint/validator.sh:/usr/local/bin/validator.sh
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/validator1:/root/validatordata
