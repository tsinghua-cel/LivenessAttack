  validator1:
    image: tscel/bf.prysm:v5.2.0-liveness
    entrypoint: /usr/local/bin/validator.sh
    environment:
      - VALIDATORS_NUM=86
      - VALIDATORS_INDEX=0
      - BEACONRPC=beacon1:4000
      - ATTACKER_SERVICE_URL=http://attacker1:10000
