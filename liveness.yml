version: "3.8"

services:
  ethmysql:
    image: "mysql:latest"
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.role == mysql
    volumes:
      - /etc/localtime:/etc/localtime
      - ${BASEDIR}./data/mysql/data:/var/lib/mysql
      - ${BASEDIR}./config/mysql/conf/my.cnf:/etc/my.cnf
      - ${BASEDIR}./config/mysql/init:/docker-entrypoint-initdb.d/
    networks:
      - meta

  execute1:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 1
    volumes:
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/execute1:/root/gethdata
      - ${BASEDIR}./entrypoint/execute.sh:/usr/local/bin/execution.sh
    networks:
      - meta

  execute2:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 2
    volumes:
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/execute2:/root/gethdata
      - ${BASEDIR}./entrypoint/execute.sh:/usr/local/bin/execution.sh
    networks:
      - meta

  execute3:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 3
    volumes:
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/execute3:/root/gethdata
      - ${BASEDIR}./entrypoint/execute.sh:/usr/local/bin/execution.sh
    networks:
      - meta

  execute4:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 4
    volumes:
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/execute4:/root/gethdata
      - ${BASEDIR}./entrypoint/execute.sh:/usr/local/bin/execution.sh
    networks:
      - meta

  execute5:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 5
    volumes:
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/execute5:/root/gethdata
      - ${BASEDIR}./entrypoint/execute.sh:/usr/local/bin/execution.sh
    networks:
      - meta

  attacker1:
    image: tscel/bunnyfinder:latest
    entrypoint: attacker --config /root/config.toml --strategy ext_withholding --max-hack-idx 85 --logpath /root/attackerdata/d.log --loglevel info
    environment:
      - NAME=attacker1
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 1
    volumes:
      - ${BASEDIR}./config/attacker-config.toml:/root/config.toml
      - ${BASEDIR}./config/strategy-empty.json:/root/strategy.json
      - ${BASEDIR}./data/attacker1:/root/attackerdata
    networks:
      - meta

  attacker2:
    image: tscel/bunnyfinder:latest
    entrypoint: attacker --config /root/config.toml --strategy ext_withholding --max-hack-idx 85 --logpath /root/attackerdata/d.log --loglevel info
    environment:
      - NAME=attacker2
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 2
    volumes:
      - ${BASEDIR}./config/attacker-normal.toml:/root/config.toml
      - ${BASEDIR}./config/strategy-empty.json:/root/strategy.json
      - ${BASEDIR}./data/attacker2:/root/attackerdata
    networks:
      - meta

  beacon1:
    image: tscel/bf.prysm:v5.2.0-liveness
    entrypoint: /usr/local/bin/beacon.sh
    env_file:
      - .env
    environment:
      - PEER_SERVICES=beacon2,beacon3,beacon4,beacon5
      - EXECUTE=execute1
      - MAXPEERS=70
      - ATTACKER_SERVICE_URL=http://attacker1:10000
      - P2PKEY=${P2PKEY_beacon1}
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 1
    volumes:
      - ${BASEDIR}./beacon.sh:/usr/local/bin/beacon.sh
      - ${BASEDIR}./config:/root/config
      - ${BASEDIR}./data/beacon1:/root/beacondata
    depends_on:
      - execute1
    networks:
      - meta

  beacon2:
    image: tscel/bf.prysm:v5.2.0-liveness
    entrypoint: /usr/local/bin/beacon.sh
    environment:
      - PEER_SERVICES=beacon1,beacon3,beacon4,beacon5
      - EXECUTE=execute2
      - MAXPEERS=70
      - ATTACKER_SERVICE_URL=http://attacker1:10000
      - P2PKEY=${P2PKEY_beacon2}
    deploy:
