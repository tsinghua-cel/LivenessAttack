networks:
  meta:
    driver: overlay
    ipam:
      config:
        - subnet: 172.86.1.0/24

volumes:
  mysql_data:
    driver: local
  execute1_data:
    driver: local
  execute2_data:
    driver: local
  execute3_data:
    driver: local
  execute4_data:
    driver: local
  execute5_data:
